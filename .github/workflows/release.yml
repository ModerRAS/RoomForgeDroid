name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Test and assemble release
        run: chmod +x ./gradlew && ./gradlew :core:test :app:assembleRelease
      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少签名 secrets（ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD / ANDROID_STORE_PASSWORD），去仓库 Settings > Secrets and variables > Actions 里加。"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          UNSIGNED=$(ls app/build/outputs/apk/release/app-release-unsigned.apk)
          SIGNED=app/build/outputs/apk/release/RoomForgeDroid-${{ github.ref_name }}.apk
          cp "$UNSIGNED" "$SIGNED"
          jarsigner -keystore release.keystore -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" "$SIGNED" "$KEY_ALIAS"
          rm release.keystore
          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "见仓库 README 的版本说明。覆盖安装要求签名一致；签不一致需先卸载旧版。" \
            "$SIGNED_APK"
